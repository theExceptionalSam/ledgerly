name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ledgerly_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - name: Check backend modules load
        run: |
          node -e "
            const modules = [
              './src/routes/auth.routes',
              './src/routes/students.routes',
              './src/routes/payments.routes',
              './src/routes/transactions.routes',
              './src/routes/dashboard.routes',
              './src/routes/audit.routes',
              './src/routes/terms.routes',
              './src/routes/fee-heads.routes',
              './src/routes/sessions.routes',
              './src/routes/users.routes',
              './src/controllers/auth.controller',
              './src/controllers/students.controller',
              './src/controllers/payments.controller',
              './src/controllers/transactions.controller',
              './src/controllers/dashboard.controller',
              './src/controllers/audit.controller',
              './src/controllers/terms.controller',
              './src/controllers/fee-heads.controller',
              './src/controllers/sessions.controller',
              './src/controllers/receipts.controller',
              './src/controllers/users.controller',
              './src/controllers/studentsBulk.controller',
              './src/middleware/auth',
              './src/middleware/security',
              './src/middleware/validate',
              './src/utils/tokens',
              './src/utils/audit',
              './src/utils/otp',
              './src/utils/logger',
              './src/utils/receipt-pdf',
            ];
            let ok = true;
            for (const m of modules) {
              try { require(m); } catch(e) {
                console.error('FAILED:', m, e.message);
                ok = false;
              }
            }
            if (ok) console.log('All backend modules load OK');
            else process.exit(1);
          "
        env:
          JWT_ACCESS_SECRET: ci-test-access-secret-not-placeholder
          JWT_REFRESH_SECRET: ci-test-refresh-secret-not-placeholder

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ledgerly_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npm run build
